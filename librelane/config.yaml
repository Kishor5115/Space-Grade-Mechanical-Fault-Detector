meta:
  version: 3
  flow: Classic

DESIGN_NAME: top

VERILOG_FILES:
  - dir::../rtl/multiplier.v
  - dir::../rtl/clk_divider.v
  - dir::../rtl/ff_2_sync.v
  - dir::../rtl/apb_arb2.v
  - dir::../rtl/cmd_spi_slave.v
  - dir::../rtl/apb.v
  - dir::../rtl/spi_master.v
  - dir::../rtl/spi_apb_interface.v
  - dir::../rtl/tmr_reg_bank.v
  - dir::../rtl/axis_sequencer.v
  - dir::../rtl/goertzel_core.v
  - dir::../rtl/magnitude_compute.v
  - dir::../rtl/fault_flagger.v
  - dir::../rtl/top.v


IO_PIN_ORDER_CFG: dir::pins.cfg
ERRORS_ON_UNMATCHED_IO: both

CLOCK_PORT: clk
CLOCK_PERIOD: 62.5
 #actually 62.5 but ti prevent setup vio

# Custom SDC — overrides LibreLane's default base.sdc.
FALLBACK_SDC: dir::constraints.sdc
PNR_SDC_FILE: dir::pnr_constraints.sdc
SIGNOFF_SDC_FILE: dir::signoff_constraints.sdc

# Die sizing left relative — actual instance count for this design is unknown
# until synthesis runs (TMR triplication + Goertzel core will not be counter-sized).

# # Floorplan & Placement
FP_SIZING:    absolute
DIE_AREA:     [0, 0, 800, 800]
PL_TARGET_DENSITY_PCT: 65

GPL_CELL_PADDING: 2
DPL_CELL_PADDING: 2


VDD_NETS: [VDD]
GND_NETS: [VSS]

PRIMARY_GDSII_STREAMOUT_TOOL: klayout
DIODE_ON_PORTS: in
RT_MAX_LAYER: Metal4
PDN_MULTILAYER: false

PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_EXTEND_TO: boundary

TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 1
RIGHT_MARGIN_MULT: 1

SYNTH_STRATEGY: "AREA 3"
SYNTH_MUL_BOOTH: true
SYNTH_SIZING: true    

# ------------------------------------------------------------
# Design-rule (DRV) repair
# ------------------------------------------------------------
# These three are consumed by the custom SDC files (constraints.sdc /
# pnr_constraints.sdc / signoff_constraints.sdc), which re-declare them via
# $::env(...). They are listed here as the single source of truth.
#
# IMPORTANT: because this design sets FALLBACK_SDC / PNR_SDC_FILE /
# SIGNOFF_SDC_FILE, LibreLane's built-in scripts/base.sdc is NOT used, and
# base.sdc is what normally turns these into set_max_fanout /
# set_max_transition / set_max_capacitance. If you ever remove the DRV block
# from those SDC files, these values go silently dead again.
# MAX_FANOUT_CONSTRAINT: right-sizing note.
#   10 (the LibreLane default) was tried first and OVER-corrected: with 1,767
#   flops on sys_rst_n it forced ~200 reset buffers (399 across the design),
#   and the extra routing demand made OpenROAD.GlobalRouting fail to converge
#   (GRT-0116 congestion). Fanout 10 is far tighter than a reset distribution
#   tree needs -- industry reset trees commonly run 20-40.
#   The violation being fixed is max_transition (2.97-3.55 ns vs a 2.6 ns limit
#   at ff_n40C_5v50). Transition scales with load, so dropping 125-280 loads
#   per branch to 20 is already a 6-14x load reduction -- more than enough.
#   Do NOT "fix" the congestion with GRT_ALLOW_CONGESTION: that just lets the
#   router proceed dirty and pushes the problem into detailed routing as DRC.
MAX_FANOUT_CONSTRAINT: 20
MAX_TRANSITION_CONSTRAINT: 3
MAX_CAPACITANCE_CONSTRAINT: 0.2

# Run design repair again AFTER global routing. The default flow only repairs
# post-global-placement, where wire RC is *estimated*; signoff STA measures
# *extracted* (RCX/SPEF) RC, which is worse. That gap is why max-slew count
# grew 38 (pre-PnR) -> 260 (post-route) before this was enabled.
RUN_POST_GRT_DESIGN_REPAIR: true
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 10
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 10


# CTS & Routing
CTS_APPLY_NDR: none
CTS_CLK_MAX_WIRE_LENGTH: 0
CTS_DISTANCE_BETWEEN_BUFFERS: 0
CTS_SINK_CLUSTERING_SIZE: 20
CTS_SINK_CLUSTERING_MAX_DIAMETER: 60
#GRT_ALLOW_CONGESTION:  true

# Linter warnings suppressed

RUN_LINTER: true
LINTER_DISABLE_WARNINGS_BLACKBOX:
  - UNDRIVEN
  - UNUSEDSIGNAL
  - TIMESCALEMOD
  - PINMISSING
LINTER_DISABLE_WARNINGS:
  - DECLFILENAME
  - EOFNEWLINE
  - MODDUP
  - MODMISSING
  - PINCONNECTEMPTY
  - PINMISSING
  - WIDTHEXPAND
  - WIDTHTRUNC
  - UNUSEDPARAM
  - UNUSEDSIGNAL
  - CASEINCOMPLETE
  - SYNCASYNCNET